[workspace]
resolver = "2"
members = [
  "crates/tt-core",
  "crates/tt-cuda",
  "crates/tt-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/compusophy/tt-rs"
authors = ["compusophy"]
description = "Tensor-train decomposition library — Rust core + CUDA kernels."

[workspace.dependencies]
ndarray = "0.16"
nalgebra = "0.33"
num-traits = "0.2"
thiserror = "2"
rand = "0.8"
rand_distr = "0.4"
cudarc = { version = "0.13", features = ["cuda-11070"], default-features = false }
criterion = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1                  # keep frames so profilers stay readable
