[package]
name = "tt-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Benchmark harness for TT-core and TT-CUDA, with baselines."

[dependencies]
tt-core = { path = "../tt-core" }
tt-cuda = { path = "../tt-cuda" }
ndarray = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
rand = { workspace = true }

[[bench]]
name = "matvec"
harness = false

[[bin]]
name = "matvec-numbers"
path = "src/bin/matvec_numbers.rs"

[[bin]]
name = "attention-demo"
path = "src/bin/attention_demo.rs"
